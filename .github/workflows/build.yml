
name: Build CodeMaster APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract CodeMaster ZIP
        run: |
          unzip -o CodeSpace_Mobile_App.zip -d project

      - name: Configure 32-bit and 64-bit support
        run: |
          cd project
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          if "abiFilters" in s:
              import re
              s = re.sub(
                  r'abiFilters\s+[^}]+',
                  'abiFilters "arm64-v8a", "armeabi-v7a"',
                  s,
                  count=1
              )
          else:
              s = s.replace(
                  "defaultConfig {",
                  'defaultConfig {\n        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }',
                  1
              )

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Rename APK
        run: |
          mv project/app/build/outputs/apk/debug/app-debug.apk \
             project/app/build/outputs/apk/debug/CodeMaster.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeMaster-APK
          path: project/app/build/outputs/apk/debug/CodeMaster.apk
