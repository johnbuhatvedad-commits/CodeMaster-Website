name: Build CodeMaster APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract CodeMaster ZIP
        run: |
          unzip -o CodeMaster_Offline_Project_v3.zip -d project

      - name: Configure Android ABI
        run: |
          cd project
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          if "abiFilters" not in s:
              s = s.replace(
                  "defaultConfig {",
                  'defaultConfig {\n        ndk { abiFilters "arm64-v8a" }',
                  1
              )
          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeMaster-APK
          path: project/app/build/outputs/apk/debug/*.apk
